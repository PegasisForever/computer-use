[package]
name = "computer-use"
version = "0.1.0"
edition = "2024"

[features]
default = []
tls = ["dep:axum-server", "dep:rustls", "dep:rustls-pemfile"]

[dependencies]
rmcp = { version = "1.6.0", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
anyhow = "1"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
resvg = "0.47"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
subtle = "2"
ipnet = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"

[dependencies.axum-server]
version = "0.7"
optional = true
features = ["tls-rustls"]

[dependencies.rustls]
version = "0.23"
optional = true

[dependencies.rustls-pemfile]
version = "2"
optional = true
